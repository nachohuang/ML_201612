<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>客戶需求文件比對／翻譯／歸檔工具</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid #8884; padding-bottom: 0.3rem; }
  h3 { font-size: 1rem; margin: 1rem 0 0.3rem; }
  fieldset { border: 1px solid #8884; border-radius: 6px; margin-bottom: 1rem; }
  label { display: inline-block; margin: 0.3rem 0.6rem 0.3rem 0; }
  input[type="text"], input[type="number"], input[type="date"], select { padding: 0.2rem 0.4rem; }
  .field-row { margin: 0.5rem 0; }
  .col-input { display: inline-flex; flex-direction: column; align-items: flex-start; font-size: 0.8rem; margin: 0.2rem; }
  #trackingColumnGrid { display: flex; flex-wrap: wrap; }
  button { padding: 0.4rem 1rem; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
  th, td { border: 1px solid #8884; padding: 0.3rem 0.5rem; text-align: left; font-size: 0.9rem; }
  .translation-input, .note-input, .track-input { width: 100%; box-sizing: border-box; }
  #status, #trackingStatus, .item-status { margin-top: 1rem; padding: 0.6rem; border-radius: 6px; background: #8882; white-space: pre-line; }
  #status.error, #trackingStatus.error, .item-status.error { background: #f005; }
  .hint { font-size: 0.85rem; opacity: 0.75; }
  .drop-zone { border: 2px dashed #8886; border-radius: 8px; padding: 0.8rem; margin: 0.3rem 0; transition: background 0.15s, border-color 0.15s; }
  .drop-zone.drag-over { background: #8882; border-color: #4a90d9; }
  .sheet-mapping-card { border: 1px solid #8884; border-radius: 6px; padding: 0.6rem 1rem; margin-bottom: 0.5rem; overflow-x: auto; }
  .sheet-mapping-card table { min-width: max-content; }
  .sheet-card-heading { display: block; font-weight: 600; cursor: pointer; }
  .sheet-card-heading input { margin-right: 0.4rem; }
  .sheet-card-detail { margin-top: 0.6rem; }
  .sheet-table-detail { margin-top: 0.5rem; }
  .version-match-section { border: 1px solid #d9a04a; border-radius: 6px; padding: 0.8rem; background: #d9a04a1a; margin: 0.5rem 0; }

  .tab-nav { display: flex; gap: 0.4rem; border-bottom: 1px solid #8884; margin-top: 1rem; }
  .tab-btn { background: none; border: 1px solid #8884; border-bottom: none; border-radius: 6px 6px 0 0; padding: 0.5rem 1rem; opacity: 0.6; }
  .tab-btn.active { opacity: 1; font-weight: 600; background: #8882; }

  .file-list { list-style: none; padding: 0; margin: 0.3rem 0; font-size: 0.9rem; }
  .file-list li { padding: 0.15rem 0; }

  .doc-item-card { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .doc-item-card h3 { margin-top: 0; }
  .doc-item-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .doc-item-diff, .doc-item-translation { margin-top: 1rem; overflow-x: auto; }

  #trackingTableSection { margin-top: 1rem; overflow-x: auto; }
</style>
</head>
<body>
<h1>客戶需求文件比對／翻譯／歸檔工具</h1>
<p class="hint">流程：拖拉或選擇一至多份新版文件（+ 可選的 .eml 信件／追蹤表）→ 每份文件各自設定欄位對應、分析差異、填寫翻譯與備註 → 產生歸檔 zip 下載。追蹤表的檢視/編輯請切到「追蹤表管理」頁籤。</p>

<nav class="tab-nav">
  <button type="button" class="tab-btn active" id="tabBtnDocs">新舊文件上傳及比對</button>
  <button type="button" class="tab-btn" id="tabBtnTracking">追蹤表管理</button>
</nav>

<section id="docsPage">
  <h2>步驟 1：提供文件</h2>

  <div class="drop-zone" id="newDocDropZone">
    <label>新版文件（必填，可一次選取／拖拉多個檔案，支援 .xlsx / .docx）<input type="file" id="newDocFiles" accept=".xlsx,.docx" multiple /></label>
  </div>
  <ul class="file-list" id="newDocFileList"></ul>

  <div class="drop-zone" id="emlDropZone">
    <label>客戶原始信件 .eml（可選，一封信通用，會自動解析寄件者/日期）<input type="file" id="emlFile" accept=".eml" /></label>
  </div>
  <div class="drop-zone" id="trackingDropZone">
    <label>既有追蹤表.xlsx（可選，用檔名比對版本並在產出時自動更新列；如需檢視/編輯整份追蹤表請到「追蹤表管理」頁籤）<input type="file" id="trackingFile" accept=".xlsx" /></label>
  </div>

  <div id="docItemsContainer"></div>

  <button id="generateBtn">產生歸檔並下載（全部文件）</button>
  <div id="status"></div>
</section>

<section id="trackingPage" hidden>
  <h2>追蹤表管理</h2>
  <p class="hint">匯入既有追蹤表可直接在畫面上檢視/編輯每一列（含確認狀態、備註等），編輯完按「儲存並下載」覆蓋回原本存放的位置；沒有既有追蹤表的話用「建立新的追蹤表」從空白開始。</p>

  <div class="drop-zone" id="trackingMgmtDropZone">
    <label>匯入追蹤表.xlsx<input type="file" id="trackingMgmtFile" accept=".xlsx" /></label>
  </div>
  <div class="field-row">
    <button id="trackingCreateNewBtn">建立新的追蹤表</button>
  </div>

  <div id="trackingTableSection" hidden>
    <table id="trackingTable">
      <thead><tr id="trackingTableHeadRow"></tr></thead>
      <tbody id="trackingTableBody"></tbody>
    </table>
    <div class="field-row">
      <button id="trackingAddRowBtn">新增列</button>
      <button id="trackingSaveBtn">儲存並下載追蹤表</button>
    </div>
  </div>
  <div id="trackingStatus"></div>

  <details style="margin-top: 2rem;">
    <summary>追蹤表欄位對應設定（進階，通常只需設定一次）</summary>
    <fieldset>
      <div class="field-row">
        <label>工作表名稱<input type="text" id="trackingSheetName" /></label>
        <label>表頭列號<input type="number" id="trackingHeaderRow" value="1" min="1" style="width:4em" /></label>
      </div>
      <div id="trackingColumnGrid"></div>
    </fieldset>
    <button id="saveSettingsBtn">儲存設定</button>
  </details>
</section>

<script src="libs/exceljs.min.js"></script>
<script src="libs/jszip.min.js"></script>
<script src="js/app.bundle.js"></script>
</body>
</html>
