[project]
name = "doc-update-tool"
version = "0.1.0"
description = "客戶需求文件更新處理自動化工具"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "extract-msg>=0.48",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
docmgr = "doc_update_tool.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
